<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f0eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Luma" />
  <title>Luma — Suivi de traitements</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- SPLASH -->
  <div id="splash">
    <div class="splash-logo">
      <div class="splash-icon">🌿</div>
      <h1>Luma</h1>
      <p>Suivi de traitements</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">

    <!-- HEADER -->
    <header id="app-header">
      <div class="header-inner">
        <div class="header-logo">🌿 Luma</div>
        <div class="header-date" id="header-date"></div>
      </div>
    </header>

    <!-- SCREENS -->
    <main id="screens">
      <section id="screen-today" class="screen active"></section>
      <section id="screen-calendar" class="screen"></section>
      <section id="screen-medications" class="screen"></section>
      <section id="screen-settings" class="screen"></section>
    </main>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-screen="today">
        <span class="nav-icon">☀️</span>
        <span class="nav-label">Aujourd'hui</span>
      </button>
      <button class="nav-btn" data-screen="calendar">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Calendrier</span>
      </button>
      <button class="nav-btn" data-screen="medications">
        <span class="nav-icon">💊</span>
        <span class="nav-label">Traitements</span>
      </button>
      <button class="nav-btn" data-screen="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Réglages</span>
      </button>
    </nav>
  </div>

  <!-- MODAL OVERLAY -->
  <div id="modal-overlay" class="hidden">
    <div id="modal-box">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="hidden"></div>

  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/intakes.js"></script>
  <script src="js/today.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/medications.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
