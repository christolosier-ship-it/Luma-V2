<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2494F2" />
  <title>Luma V3.1 — Protocole & Journal</title>
  <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash"><div class="splash-logo"><div style="width:88px;height:88px;border-radius:22px;background:linear-gradient(135deg,#b5ecff,#2a86ff);margin:0 auto 8px;"></div><h1>Luma V3.1</h1><p>Protocole & Journal</p></div></div>
  <div id="app" class="hidden">
    <header id="app-header"><div class="header-inner"><div class="header-logo">Luma</div><div class="header-date" id="header-date"></div></div></header>
    <main id="screens">
      <section id="screen-today" class="screen active"></section>
      <section id="screen-timeline" class="screen"></section>
      <section id="screen-journal" class="screen"></section>
      <section id="screen-medications" class="screen"></section>
      <section id="screen-settings" class="screen"></section>
    </main>
    <nav id="bottom-nav">
      <button class="nav-btn active" data-screen="today"><span class="nav-icon">☀️</span><span class="nav-label">Aujourd’hui</span></button>
      <button class="nav-btn" data-screen="timeline"><span class="nav-icon">🕒</span><span class="nav-label">Timeline</span></button>
      <button class="nav-btn" data-screen="journal"><span class="nav-icon">🧾</span><span class="nav-label">Journal</span></button>
      <button class="nav-btn" data-screen="medications"><span class="nav-icon">💊</span><span class="nav-label">Traitements</span></button>
      <button class="nav-btn" data-screen="settings"><span class="nav-icon">⚙️</span><span class="nav-label">Réglages</span></button>
    </nav>
  </div>
  <div id="modal-overlay" class="hidden"><div id="modal-box"><div id="modal-content"></div></div></div>
  <div id="toast" class="hidden"></div>
  <script src="js/db.js"></script><script src="js/utils.js"></script><script src="js/intakes.js"></script><script src="js/today.js"></script><script src="js/timeline.js"></script><script src="js/journal.js"></script><script src="js/medications.js"></script><script src="js/settings.js"></script><script src="js/modal.js"></script><script src="js/app.js"></script>
</body></html>
