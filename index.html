<!DOCTYPE html>

  <div id="toast" class="hidden"></div>
  <script src="js/db.js"></script><script src="js/utils.js"></script><script src="js/intakes.js"></script><script src="js/today.js"></script><script src="js/dailyEntryModals.js"></script><script src="js/timeline.js"></script><script src="js/journal.js"></script><script src="js/medications.js"></script><script src="js/settings.js"></script><script src="js/modal.js"></script><script src="js/app.js"></script>
